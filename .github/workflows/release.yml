name: Release

# The newest `## <version>` section of CHANGELOG.md names the version on main.
# Whenever that version has no tag yet, run the tests, tag the commit and create
# a GitHub release whose notes are that section.
# The release carries helo built for each platform, plus checksums.txt.
# A stable release also updates the Homebrew formula in helo-email/homebrew-tap.
#
# CHANGELOG.md is generated by helo-sdk-generator, which refuses to generate
# unless its newest section matches the package version.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      unreleased: ${{ steps.version.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(awk '/^## /{print $2; exit}' CHANGELOG.md)
          if [ -z "$version" ]; then
            echo "::error::CHANGELOG.md has no '## <version>' section" && exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists, nothing to release."
          else
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.unreleased == 'true'
    uses: ./.github/workflows/test.yml

  # Before the release rather than after it, so a failed build leaves no
  # release (or tag) behind, and re-running the workflow retries it.
  build:
    needs: check
    if: needs.check.outputs.unreleased == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The newest Go, for its security fixes: go.mod's go line is only the
      # oldest version the module builds with.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Build binaries
        env:
          TAG: ${{ needs.check.outputs.tag }}
          NAME: helo
          PACKAGE: ./cmd/helo
          VERSION_VARIABLE: github.com/helo-email/helo-cli/internal/commands.version
        run: |
          set -euo pipefail
          dist="$PWD/dist"
          mkdir -p "$dist"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            # No version in the name, so releases/latest/download/<archive> always works.
            archive="${NAME}_${GOOS}_${GOARCH}"
            executable="$NAME"
            [ "$GOOS" = windows ] && executable="$NAME.exe"
            staging="$(mktemp -d)"
            go build -trimpath -ldflags "-s -w -X $VERSION_VARIABLE=$TAG" -o "$staging/$executable" "$PACKAGE"
            cp README.md CHANGELOG.md "$staging/"
            if [ "$GOOS" = windows ]; then
              (cd "$staging" && zip -q "$dist/$archive.zip" "$executable" README.md CHANGELOG.md)
            else
              tar -czf "$dist/$archive.tar.gz" -C "$staging" "$executable" README.md CHANGELOG.md
            fi
            rm -rf "$staging"
          done
          (cd "$dist" && sha256sum -- * > checksums.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error

  release:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and GitHub release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist/

      # Creates the tag on this commit too. Any letter or hyphen in the version
      # (1.1.0-beta.1, 1.1.0b1, 1.1.0rc1) marks a prerelease.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          awk '/^## /{n++; next} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          prerelease=$([[ "$VERSION" =~ [A-Za-z-] ]] && echo --prerelease || true)
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease dist/*

  # `brew install helo-email/tap/helo`. A formula rather than a
  # cask, since Homebrew doesn't quarantine what a formula downloads, so macOS
  # runs the unsigned binary without a Gatekeeper warning.
  homebrew:
    needs: [check, release]
    runs-on: ubuntu-latest
    steps:
      - name: Check for a prerelease and the tap token
        id: check
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ "$VERSION" =~ [A-Za-z-] ]]; then
            echo "$VERSION is a prerelease, which the formula doesn't offer."
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN secret to a token that can push to helo-email/homebrew-tap, then re-run this job."
            exit 1
          fi
          echo "update=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.update == 'true'
        with:
          name: binaries
          path: dist/

      - uses: actions/checkout@v7
        if: steps.check.outputs.update == 'true'
        with:
          repository: helo-email/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        if: steps.check.outputs.update == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          NAME: helo
          CLASS: Helo
          DESCRIPTION: "CLI for Helo API"
        run: |
          set -euo pipefail
          sha() {
            local archive="${NAME}_$1.tar.gz" sum
            sum=$(awk -v archive="$archive" '$2 == archive { print $1 }' dist/checksums.txt)
            [ -n "$sum" ] || { echo "::error::checksums.txt has no $archive" >&2; return 1; }
            echo "$sum"
          }
          darwin_arm64=$(sha darwin_arm64)
          darwin_amd64=$(sha darwin_amd64)
          linux_arm64=$(sha linux_arm64)
          linux_amd64=$(sha linux_amd64)
          url="$REPOSITORY_URL/releases/download/$TAG/$NAME"
          mkdir -p tap/Formula
          cat > "tap/Formula/$NAME.rb" <<FORMULA
          # Generated by the release workflow of $REPOSITORY_URL.
          class $CLASS < Formula
            desc "$DESCRIPTION"
            homepage "$REPOSITORY_URL"
            version "$VERSION"

            on_macos do
              on_arm do
                url "${url}_darwin_arm64.tar.gz"
                sha256 "$darwin_arm64"
              end
              on_intel do
                url "${url}_darwin_amd64.tar.gz"
                sha256 "$darwin_amd64"
              end
            end

            on_linux do
              on_arm do
                url "${url}_linux_arm64.tar.gz"
                sha256 "$linux_arm64"
              end
              on_intel do
                url "${url}_linux_amd64.tar.gz"
                sha256 "$linux_amd64"
              end
            end

            def install
              bin.install "$NAME"
            end

            test do
              assert_match "v#{version}", shell_output("#{bin}/$NAME --version")
            end
          end
          FORMULA

      - name: Push formula
        if: steps.check.outputs.update == 'true'
        working-directory: tap
        env:
          NAME: helo
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/$NAME.rb"
          if git diff --cached --quiet; then
            echo "Formula/$NAME.rb is already at $VERSION."
            exit 0
          fi
          git commit -m "$NAME $VERSION"
          git push
